services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - pharmastock_mongo:/data/db

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: pharmastock
      JWT_SECRET: dev-only-change-me
      DEMO_PASSWORD: change-me-demo-only
      SEED_ON_START: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3001
    depends_on:
      - mongo

volumes:
  pharmastock_mongo:
